# Frontend → Netlify. Backend on EasyPanel:
#   https://anton-morf.hrvnvm.easypanel.host
# (hardcoded in frontend/src/core/morphClient.ts)

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (safe even without a client router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
